<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sheianty's Rescue</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fdfaf2;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;font-family:"Comic Sans MS","Segoe Print","Bradley Hand",cursive;color:#2b3a6b}
#app{height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}
#hud{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 2px;font-weight:bold;font-size:18px}
#lives{color:#ff3d86;letter-spacing:2px;min-width:80px}
#nbar{height:20px;margin:0 8px;border:2px solid #2b3a6b;border-radius:10px;position:relative;visibility:hidden;overflow:hidden;background:#fff}
#nfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#ffd23f}
#nt{position:relative;display:block;text-align:center;font-size:12px;line-height:16px;font-weight:bold}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
#dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,40px);gap:3px;justify-content:center;padding:4px 0 8px}
#dpad button{border:2px solid #2b3a6b;background:#fff;border-radius:12px;font-size:20px;color:#2b3a6b;padding:0;touch-action:none}
#dpad button:active{background:#ffd3e6}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#fdfaf2;z-index:10}
.ov.show{display:flex}
.card{max-width:430px;width:100%;padding:14px;text-align:center}
.imgw{height:44dvh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.imgw img{max-width:100%;max-height:44dvh;object-fit:contain;mix-blend-mode:multiply;filter:contrast(1.06) brightness(1.02)}
#intro .imgw img{animation:kb 6s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-1.5deg)}75%{transform:translate(3px,-1px) rotate(1.5deg)}}
.shout{font-size:26px;margin:8px 0;color:#e6004c;animation:shake .35s infinite}
.card h2{font-size:30px;margin:8px 0;color:#e6004c}
.card p{font-size:15px;line-height:1.35;margin:6px 4px 12px}
.btn{font-family:inherit;font-size:20px;font-weight:bold;padding:10px 26px;border:3px solid #2b3a6b;border-radius:16px;background:#ff8fbd;color:#2b3a6b;box-shadow:0 4px 0 #2b3a6b;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b3a6b}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><div id="lives"></div><div id="score">0</div><div id="hc"></div></div>
  <div id="nbar"><div id="nfill"></div><span id="nt"></span></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="dpad">
    <span></span><button data-d="u">&#9650;</button><span></span>
    <button data-d="l">&#9664;</button><span></span><button data-d="r">&#9654;</button>
    <span></span><button data-d="d">&#9660;</button><span></span>
  </div>
</div>

<div class="ov show" id="intro"><div class="card">
  <div class="imgw"><img src="assets/jail.jpg" alt="Christian in jail" onerror="this.style.display='none'"></div>
  <h1 class="shout">"BABY HELP MEEEE!!!"</h1>
  <p>Christian is locked in jail! Run through the notebook maze, collect every heart and rescue him. Dodge the ghosts &mdash; or grab an NMAX Smart Key and VROOM right through them!</p>
  <button class="btn" id="bStart">&#9654; START RESCUE</button>
</div></div>

<div class="ov" id="over"><div class="card">
  <div class="imgw"><img src="assets/caught.jpg" alt="Caught" onerror="this.style.display='none'"></div>
  <h2 id="overT">CAUGHT!</h2>
  <p id="overP">The ghosts got you!</p>
  <button class="btn" id="bRetry" style="display:none">&#8635; RETRY</button>
</div></div>

<div class="ov" id="win"><div class="card">
  <div class="imgw"><img src="assets/victory.jpg" alt="Victory" onerror="this.style.display='none'"></div>
  <h2>RESCUED!</h2>
  <p id="winP">Sheianty saved Christian!</p>
  <button class="btn" id="bAgain">&#9829; PLAY AGAIN</button>
</div></div>

<script>
(function(){
'use strict';
/* ---------- Config ---------- */
var MAP=[
"###############",
"#o....JJJ....o#",
"#.###.JJJ.###.#",
"#.............#",
"#.##.#####.##.#",
"#....#...#....#",
"#.##.#.#.#.##.#",
"#.............#",
"#.##.##.##.##.#",
"#.............#",
"#.##.#.#.#.##.#",
"#....#...#....#",
"#.##.#####.##.#",
"#.............#",
"#.##.#.#.#.##.#",
"#o...........o#",
"###############"];
var COLS=15,ROWS=17;
var FONT='"Comic Sans MS","Segoe Print","Bradley Hand",cursive';
var SHEIANTY_FACES=1;  /* 1 = source image faces right (flipped when moving left) */
var NMAX_FACES=-1;     /* nmax.jpg faces left per spec */
var DIRS=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
var GHOST_RGB=[[255,59,59],[255,122,200],[40,215,230],[255,154,46]];
var GHOST_START=[[4,7],[10,7],[5,9],[9,9]];
var GHOST_DELAY=[0.6,2,3.5,5];
var NMAX_TIME=8;

var $=function(id){return document.getElementById(id);};
var cv=$('cv'),ctx=cv.getContext('2d');
var IMG={};
['jail','sheianty','caught','ghost1','ghost2','nmax','victory'].forEach(function(n){var i=new Image();i.src='assets/'+n+'.jpg';IMG[n]=i;});
function ok(i){return i&&i.complete&&i.naturalWidth>0;}

/* ---------- State ---------- */
var T=20,dpr=1,state='intro',time=0;
var grid,segs=[],score=0,lives=3,left=0,total=0,nmaxT=0,caughtT=0;
var player,ghosts=[],want=null,face=1,pops=[];

function mk(c,r){return {c:c,r:r,dx:0,dy:0,p:0};}
function pos(e){return {x:e.c+e.dx*e.p+0.5,y:e.r+e.dy*e.p+0.5};}
function wall(c,r){if(r<0||r>=ROWS||c<0||c>=COLS)return true;var ch=grid[r][c];return ch==='#'||ch==='J';}

/* ---------- Audio ---------- */
var AC=null,dotAlt=false;
function initAudio(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
}
function tone(f,d,type,v,to,delay){
  if(!AC)return;
  try{
    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v||0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);
  }catch(e){}
}
var sfx={
  dot:function(){tone(dotAlt?900:1200,0.07,'sine',0.07);dotAlt=!dotAlt;},
  fob:function(){tone(1400,0.09,'square',0.07);tone(1400,0.09,'square',0.07,null,0.15);},
  rev:function(){tone(70,0.8,'sawtooth',0.07,320,0.3);tone(75,0.8,'square',0.03,330,0.3);},
  bonk:function(){tone(320,0.16,'square',0.1,90);tone(200,0.12,'triangle',0.1,60,0.05);},
  caught:function(){tone(520,0.9,'sawtooth',0.1,60);},
  win:function(){[523,659,784,1047,784,1047].forEach(function(f,i){tone(f,0.2,'triangle',0.1,null,i*0.14);});}
};

/* ---------- Maze setup ---------- */
function buildWalls(){
  var s=7;function rnd(){s=(s*16807)%2147483647;return s/2147483647;}
  segs=[];
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    if(MAP[r][c]!=='#')continue;
    for(var k=0;k<4;k++){
      var d=DIRS[k],nc=c+d.x,nr=r+d.y;
      if(nc<0||nr<0||nc>=COLS||nr>=ROWS)continue;
      var ch=MAP[nr][nc];if(ch==='#'||ch==='J')continue;
      var x1,y1,x2,y2;
      if(d.x===1){x1=c+1;y1=r;x2=c+1;y2=r+1;}
      else if(d.x===-1){x1=c;y1=r;x2=c;y2=r+1;}
      else if(d.y===1){x1=c;y1=r+1;x2=c+1;y2=r+1;}
      else{x1=c;y1=r;x2=c+1;y2=r;}
      segs.push([x1,y1,(x1+x2)/2+(rnd()-0.5)*0.08,(y1+y2)/2+(rnd()-0.5)*0.08,x2,y2]);
    }
  }
}
function resetActors(){
  player=mk(7,13);want=null;face=1;nmaxT=0;pops=[];
  ghosts=GHOST_START.map(function(s,i){
    var g=mk(s[0],s[1]);g.sc=s[0];g.sr=s[1];g.type=i;g.delay=GHOST_DELAY[i];g.safe=false;return g;
  });
}
function newGame(){
  grid=MAP.map(function(r){return r.split('');});
  grid[13][7]=' ';
  left=0;
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(grid[r][c]==='.')left++;
  total=left;score=0;lives=3;
  resetActors();
  hideAll();state='play';
}
function hideAll(){['intro','over','win'].forEach(function(id){$(id).classList.remove('show');});}
function show(id){hideAll();$(id).classList.add('show');}

/* ---------- Movement ---------- */
function move(e,dist,choose,arrive){
  var guard=0;
  while(dist>1e-6&&guard++<10){
    if(e.p===0){choose(e);if(!e.dx&&!e.dy)return;}
    var s=Math.min(dist,1-e.p);
    e.p+=s;dist-=s;
    if(e.p>=0.99999){e.c+=e.dx;e.r+=e.dy;e.p=0;if(arrive)arrive(e);}
  }
}
function choosePlayer(e){
  if(want&&!wall(e.c+want.x,e.r+want.y)){e.dx=want.x;e.dy=want.y;}
  else if(wall(e.c+e.dx,e.r+e.dy)){e.dx=0;e.dy=0;}
}
function scared(g){return nmaxT>0&&!g.safe;}
function target(g){
  var pl=player;
  switch(g.type){
    case 0:return {c:pl.c,r:pl.r};
    case 1:return {c:pl.c+pl.dx*3,r:pl.r+pl.dy*3};
    case 2:return {c:2*pl.c-ghosts[0].c,r:2*pl.r-ghosts[0].r};
    default:
      var d=Math.hypot(g.c-pl.c,g.r-pl.r);
      return d>5?{c:pl.c,r:pl.r}:{c:1,r:15};
  }
}
function chooseGhost(g){
  var opts=DIRS.filter(function(d){return !wall(g.c+d.x,g.r+d.y);});
  var cand=opts.filter(function(d){return !(d.x===-g.dx&&d.y===-g.dy);});
  if(!cand.length)cand=opts;
  if(!cand.length){g.dx=0;g.dy=0;return;}
  var fl=scared(g),best=null;
  if(Math.random()<(fl?0.25:0.12)){best=cand[Math.floor(Math.random()*cand.length)];}
  else{
    var t=target(g),bv=fl?-1:1e9;
    for(var i=0;i<cand.length;i++){
      var d=cand[i],v=Math.pow(g.c+d.x-t.c,2)+Math.pow(g.r+d.y-t.r,2);
      if(fl?v>bv:v<bv){bv=v;best=d;}
    }
  }
  g.dx=best.x;g.dy=best.y;
}

/* ---------- Gameplay ---------- */
function pop(x,y,txt,col){pops.push({x:x,y:y,t:1.1,txt:txt,col:col||'#e6004c'});}
function collect(e){
  var ch=grid[e.r][e.c];
  if(ch==='.'){
    grid[e.r][e.c]=' ';score+=10;left--;sfx.dot();
    if(left<=0)winGame();
  }else if(ch==='o'){
    grid[e.r][e.c]=' ';score+=50;nmaxT=NMAX_TIME;
    sfx.fob();sfx.rev();
    var p=pos(e);pop(p.x,p.y-0.6,'VROOM!!','#e6004c');
  }
}
function winGame(){
  state='win';sfx.win();
  $('winP').textContent='Sheianty saved Christian! Score: '+score;
  setTimeout(function(){if(state==='win')show('win');},500);
}
function caught(){
  state='caught';lives--;caughtT=1.3;sfx.caught();
  $('overT').textContent=lives>0?'CAUGHT!':'GAME OVER';
  $('overP').textContent=lives>0?('Lives left: '+lives):('Final score: '+score);
  $('bRetry').style.display='none';
  show('over');
}
function update(dt){
  if(state==='caught'){
    caughtT-=dt;
    if(caughtT<=0){
      if(lives>0){hideAll();resetActors();state='play';}
      else{state='over';$('bRetry').style.display='';}
    }
    return;
  }
  if(state!=='play')return;
  if(nmaxT>0){nmaxT-=dt;if(nmaxT<0)nmaxT=0;}
  /* player */
  if(want&&player.p>0&&(player.dx||player.dy)&&want.x===-player.dx&&want.y===-player.dy){
    player.c+=player.dx;player.r+=player.dy;player.p=1-player.p;player.dx=-player.dx;player.dy=-player.dy;
  }
  move(player,(nmaxT>0?7.5:5)*dt,choosePlayer,collect);
  if(state!=='play')return;
  if(player.dx)face=player.dx;
  /* ghosts */
  ghosts.forEach(function(g){
    if(g.delay>0){g.delay-=dt;if(g.delay<=0){g.delay=0;g.safe=false;}return;}
    move(g,(scared(g)?3:4)*dt,chooseGhost,null);
  });
  /* collisions */
  var a=pos(player);
  for(var i=0;i<ghosts.length;i++){
    var g=ghosts[i];if(g.safe)continue;
    var b=pos(g);
    if(Math.hypot(a.x-b.x,a.y-b.y)<0.6){
      if(nmaxT>0){
        score+=200;sfx.bonk();pop(b.x,b.y-0.5,'+200','#2a5bff');
        g.c=g.sc;g.r=g.sr;g.dx=0;g.dy=0;g.p=0;g.delay=2.5;g.safe=true;
      }else{caught();break;}
    }
  }
  for(var j=pops.length-1;j>=0;j--){pops[j].t-=dt;if(pops[j].t<=0)pops.splice(j,1);}
}

/* ---------- Drawing ---------- */
function heart(x,y,r){
  ctx.beginPath();
  ctx.arc(x-r*0.5,y-r*0.2,r*0.5,Math.PI,0,false);
  ctx.arc(x+r*0.5,y-r*0.2,r*0.5,Math.PI,0,false);
  ctx.lineTo(x,y+r*1.0);
  ctx.closePath();ctx.fill();
}
function sprite(img,x,y,size,flip,rot,alpha,fb){
  ctx.save();
  ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);
  ctx.globalAlpha=alpha===undefined?1:alpha;
  if(ok(img)){
    var s=size/Math.max(img.naturalWidth,img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;
    ctx.globalCompositeOperation='multiply';
    ctx.drawImage(img,-w/2,-h/2,w,h);
  }else{
    ctx.fillStyle=fb||'#ff8fbd';ctx.beginPath();ctx.arc(0,0,size*0.4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function aura(x,y,rgb,rad,a){
  var g=ctx.createRadialGradient(x,y,rad*0.15,x,y,rad);
  g.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')');
  g.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();
}
function strokeText(txt,x,y,size,fill,stroke){
  ctx.font='bold '+Math.round(size)+'px '+FONT;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(2,size*0.18);ctx.lineJoin='round';
  ctx.strokeStyle=stroke||'#fff';ctx.strokeText(txt,x,y);
  ctx.fillStyle=fill;ctx.fillText(txt,x,y);
}
function drawJail(){
  var x=6*T,y=1*T,w=3*T,h=2*T,i;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  if(ok(IMG.jail)){
    var im=IMG.jail,s=Math.max(w/im.naturalWidth,h/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;
    ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  }else{ctx.fillStyle='#cfd6e6';ctx.fillRect(x,y,w,h);}
  ctx.restore();
  ctx.strokeStyle='#333';ctx.lineWidth=Math.max(2,T*0.09);ctx.lineCap='round';
  ctx.beginPath();
  for(i=0;i<=6;i++){ctx.moveTo(x+w*i/6,y);ctx.lineTo(x+w*i/6,y+h);}
  ctx.moveTo(x,y+h*0.12);ctx.lineTo(x+w,y+h*0.12);
  ctx.moveTo(x,y+h*0.88);ctx.lineTo(x+w,y+h*0.88);
  ctx.stroke();
  ctx.strokeStyle='#2b3a6b';ctx.lineWidth=Math.max(3,T*0.14);ctx.strokeRect(x,y,w,h);
  if(Math.floor(time*1.3)%2===0){
    var sh=Math.sin(time*40)*T*0.02;
    strokeText('BABY HELP',x+w/2+sh,y+h*0.38,T*0.34,'#e6004c');
    strokeText('MEEEE!!!',x+w/2-sh,y+h*0.66,T*0.34,'#e6004c');
  }
}
function drawFob(x,y,pulse){
  aura(x,y,[255,210,63],T*(0.65+0.1*pulse),0.55);
  ctx.fillStyle='#1c2a4a';ctx.fillRect(x-T*0.22,y-T*0.3,T*0.44,T*0.6);
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(x-T*0.22,y-T*0.3,T*0.44,T*0.6);
  ctx.fillStyle='#e6004c';ctx.beginPath();ctx.arc(x,y+T*0.06,T*0.1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#8a97b8';ctx.lineWidth=Math.max(1.5,T*0.05);
  ctx.beginPath();ctx.arc(x,y-T*0.4,T*0.1,0,Math.PI*2);ctx.stroke();
  strokeText('NMAX',x,y-T*0.15,T*0.14,'#fff','#1c2a4a');
}
function draw(){
  var W=COLS*T,H=ROWS*T,r,c,i;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#fdfaf2';ctx.fillRect(0,0,W,H);
  /* notebook lines */
  ctx.strokeStyle='rgba(110,160,220,0.35)';ctx.lineWidth=1;ctx.beginPath();
  for(var y=T*0.5;y<H;y+=T*0.5){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
  ctx.strokeStyle='rgba(230,100,100,0.35)';ctx.beginPath();ctx.moveTo(T*0.5,0);ctx.lineTo(T*0.5,H);ctx.stroke();
  if(!grid)return;
  /* walls */
  ctx.fillStyle='rgba(60,80,140,0.08)';
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(MAP[r][c]==='#')ctx.fillRect(c*T,r*T,T,T);
  ctx.strokeStyle='#2b3a6b';ctx.lineWidth=Math.max(2,T*0.1);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  for(i=0;i<segs.length;i++){var s=segs[i];ctx.moveTo(s[0]*T,s[1]*T);ctx.lineTo(s[2]*T,s[3]*T);ctx.lineTo(s[4]*T,s[5]*T);}
  ctx.stroke();
  drawJail();
  /* collectibles */
  ctx.fillStyle='#ff5f9e';
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++){
    var ch=grid[r][c];
    if(ch==='.'){heart((c+0.5)*T,(c+r>=0?(r+0.45)*T:0),T*0.13*(1+0.12*Math.sin(time*4+c+r)));}
  }
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(grid[r][c]==='o')drawFob((c+0.5)*T,(r+0.5)*T,Math.sin(time*5));
  /* ghosts */
  var blink=nmaxT>0&&nmaxT<2&&Math.floor(time*8)%2===0;
  ghosts.forEach(function(g,i){
    var p=pos(g),x=p.x*T,y=p.y*T+Math.sin(time*6+i)*T*0.05,sc=scared(g);
    if(sc){
      aura(x,y,blink?[255,255,255]:[60,110,255],T*0.75*(1+0.15*Math.sin(time*10)),0.85);
      sprite(IMG.ghost2,x,y,T*1.05,false,0,1,'#3b6cff');
    }else{
      aura(x,y,GHOST_RGB[i],T*0.7,0.75);
      sprite(IMG.ghost1,x,y,T*1.05,false,0,g.safe?0.4:1,'rgb('+GHOST_RGB[i].join(',')+')');
    }
  });
  /* player */
  var pp=pos(player),px=pp.x*T,py=pp.y*T,moving=(player.dx||player.dy)&&state==='play';
  if(nmaxT>0){
    aura(px,py,[255,210,63],T*0.9,0.6);
    if(moving){
      ctx.strokeStyle='rgba(230,0,76,0.6)';ctx.lineWidth=2;ctx.beginPath();
      for(i=-1;i<=1;i++){
        var ox=-player.dx*T*0.5,oy=-player.dy*T*0.5,sx=player.dy?i*T*0.25:0,sy=player.dx?i*T*0.25:0;
        ctx.moveTo(px+ox+sx,py+oy+sy);ctx.lineTo(px+ox*2.2+sx,py+oy*2.2+sy);
      }
      ctx.stroke();
    }
    var nf=face!==NMAX_FACES;
    sprite(IMG.nmax,px,py,T*1.35,nf,moving?Math.sin(time*30)*0.03:0,(nmaxT<2&&blink)?0.6:1,'#ffd23f');
  }else{
    var w=moving?Math.sin(time*14):0;
    sprite(IMG.sheianty,px,py-Math.abs(w)*T*0.08,T*1.1,face!==SHEIANTY_FACES,w*0.12,1,'#ff8fbd');
  }
  /* pops */
  pops.forEach(function(p){
    ctx.globalAlpha=Math.min(1,p.t*2);
    strokeText(p.txt,p.x*T,(p.y-(1.1-p.t)*1.2)*T,T*0.5,p.col);
  });
  ctx.globalAlpha=1;
  if(nmaxT>0){
    var k=1+0.12*Math.sin(time*12);
    strokeText('VROOM!! '+Math.ceil(nmaxT),W/2,H-T*0.5,T*0.5*k,'#e6004c');
  }
}

/* ---------- HUD ---------- */
var hudCache={};
function setT(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
function hud(){
  var l='';for(var i=0;i<3;i++)l+=i<lives?'\u2764':'\u2661';
  setT('lives',l);setT('score','Score '+score);setT('hc','\u2665 '+(total-left)+'/'+total);
  var nb=$('nbar');
  if(nmaxT>0){
    nb.style.visibility='visible';$('nfill').style.width=(nmaxT/NMAX_TIME*100)+'%';
    setT('nt','NMAX MODE '+nmaxT.toFixed(1)+'s');
  }else nb.style.visibility='hidden';
}

/* ---------- Layout ---------- */
function fit(){
  var st=$('stage'),w=st.clientWidth,h=st.clientHeight;
  T=Math.max(8,Math.floor(Math.min(w/COLS,h/ROWS)));
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=(COLS*T)+'px';cv.style.height=(ROWS*T)+'px';
  cv.width=Math.round(COLS*T*dpr);cv.height=Math.round(ROWS*T*dpr);
}

/* ---------- Input ---------- */
function setWant(d){want=d;}
var KEYS={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0}};
window.addEventListener('keydown',function(e){
  initAudio();
  var d=KEYS[e.key];
  if(d){setWant(d);e.preventDefault();return;}
  if(e.key==='Enter'||e.key===' '){
    var ov=document.querySelector('.ov.show');
    if(ov){var b=ov.querySelector('button');if(b&&b.style.display!=='none'){b.click();e.preventDefault();}}
  }
});
var DMAP={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};
Array.prototype.forEach.call(document.querySelectorAll('#dpad button'),function(b){
  b.addEventListener('pointerdown',function(e){e.preventDefault();initAudio();setWant(DMAP[b.getAttribute('data-d')]);});
});
var tx=0,ty=0,tracking=false;
window.addEventListener('touchstart',function(e){
  initAudio();var t=e.touches[0];tx=t.clientX;ty=t.clientY;tracking=true;
},{passive:true});
window.addEventListener('touchmove',function(e){
  e.preventDefault();if(!tracking)return;
  var t=e.touches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))>=22){
    setWant(Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1});
    tx=t.clientX;ty=t.clientY;
  }
},{passive:false});
window.addEventListener('touchend',function(){tracking=false;});
window.addEventListener('mousedown',initAudio);
$('bStart').addEventListener('click',function(){initAudio();newGame();});
$('bRetry').addEventListener('click',function(){initAudio();newGame();});
$('bAgain').addEventListener('click',function(){initAudio();newGame();});
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){setTimeout(fit,150);});

/* ---------- Loop ---------- */
var last=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  time+=dt;
  update(dt);draw();hud();
  requestAnimationFrame(loop);
}
buildWalls();
grid=MAP.map(function(r){return r.split('');});
resetActors();
fit();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
